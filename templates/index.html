<!doctype html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather Control Panel</title>

    <link rel="stylesheet" href="/static/style.css"/>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="/static/script.js" defer></script>
  </head>

  <body>
    <h1>WEATHER CONTROL PANEL</h1>

    <div class="cidade">
      <input
        type="text"
        id="cidade"
        list="lista-cidades"
        placeholder="Digite o nome da cidade"
      />
      <button id="buscar" type="button">Buscar</button>
      <datalist id="lista-cidades"></datalist>
    </div>

    <p id="status" role="status" aria-live="polite"></p>

    <div class="cards">
      <div class="card">
        <h3>Temperatura</h3>
        <p id="temp"></p>
      </div>

      <div class="card">
        <h3>Umidade</h3>
        <p id="umidade"></p>
      </div>

      <div class="card condition-card">
        <h3>Condição</h3>
        <div class="condition-icon">
          <img id="icone" />
        </div>
        <p id="condicao"></p>
      </div>
    </div>

    <div class="charts">
      <div class="chart-panel">
        <canvas id="tempChart"></canvas>
      </div>
      <div class="chart-panel">
        <canvas id="humChart"></canvas>
      </div>
    </div>

    <h2>Previsão para 5 dias</h2>

    <div id="forecast"></div>

    <div id="updateAnimation"></div>
  </body>
</html>
